<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Orb -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGlow)" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Rocket Flame -->
  <path d="M 28 66 Q 22 78 30 84 Q 38 78 36 68 Z" fill="url(#flame)" filter="url(#glow)"/>
  <path d="M 30 68 Q 26 76 30 80 Q 34 76 33 70 Z" fill="#ffffff"/>

  <!-- Rocket Body -->
  <path d="M 30 68 L 42 62 L 68 36 C 76 28 78 22 78 22 C 78 22 72 24 64 32 L 38 58 Z" fill="url(#rocketBody)" stroke="#7c2d12" stroke-width="2"/>

  <!-- Nosecone Tip -->
  <path d="M 68 36 C 76 28 78 22 78 22 C 78 22 72 24 64 32 Z" fill="#ef4444"/>

  <!-- Fins -->
  <path d="M 38 58 L 26 58 L 32 66 Z" fill="#dc2626"/>
  <path d="M 42 62 L 42 74 L 34 68 Z" fill="#dc2626"/>

  <!-- Porthole Window -->
  <circle cx="54" cy="46" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="52" cy="44" r="2" fill="#ffffff"/>
</svg>
