<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#hGlow)" stroke="#c084fc" stroke-width="3" filter="url(#neon)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Hoverboard Body (Isometric Angle) -->
  <g transform="rotate(-25 50 50)">
    <!-- Plasma Underglow -->
    <ellipse cx="50" cy="62" rx="34" ry="8" fill="#38bdf8" opacity="0.8" filter="url(#neon)"/>
    <ellipse cx="50" cy="62" rx="26" ry="4" fill="#ffffff" opacity="0.9"/>

    <!-- Deck -->
    <path d="M 20 48 C 15 48 15 54 22 54 L 78 54 C 85 54 85 48 80 48 Z" fill="url(#boardGrad)" stroke="#ffffff" stroke-width="2"/>
    <path d="M 22 50 L 78 50" stroke="#fdf4ff" stroke-width="1.5"/>

    <!-- Foot Straps / Energy Nodes -->
    <circle cx="34" cy="51" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <circle cx="66" cy="51" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

    <!-- Speed Lines -->
    <line x1="12" y1="51" x2="6" y2="51" stroke="#e879f9" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="57" x2="8" y2="57" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
