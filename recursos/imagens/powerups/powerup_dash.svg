<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="dglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#dGlow)" stroke="#38bdf8" stroke-width="3" filter="url(#dglow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Quantum Wings / Speed Boots -->
  <g transform="translate(50 50) rotate(-15) translate(-50 -50)">
    <!-- Speed streaks -->
    <line x1="20" y1="36" x2="36" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="50" x2="42" y2="50" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="64" x2="38" y2="64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wing/Boot Icon -->
    <path d="M 40 42 C 48 30 68 28 82 34 C 74 44 64 48 54 48 L 74 48 C 66 58 56 62 46 62 L 62 62 C 54 70 42 72 36 68 C 34 60 36 50 40 42 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#dglow)"/>
  </g>
</svg>
