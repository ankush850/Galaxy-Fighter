<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="spGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="sglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#spGlow)" stroke="#fbbf24" stroke-width="3" filter="url(#sglow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 3 Spread Plasma Torpedoes -->
  <!-- Top Angled -->
  <g transform="translate(48 50) rotate(-28) translate(-48 -50)">
    <path d="M 32 46 L 68 46 L 76 50 L 68 54 L 32 54 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sglow)"/>
    <polygon points="26,46 34,50 26,54" fill="#ef4444"/>
  </g>
  <!-- Center Straight -->
  <g>
    <path d="M 34 46 L 72 46 L 80 50 L 72 54 L 34 54 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sglow)"/>
    <polygon points="28,46 36,50 28,54" fill="#ef4444"/>
  </g>
  <!-- Bottom Angled -->
  <g transform="translate(48 50) rotate(28) translate(-48 -50)">
    <path d="M 32 46 L 68 46 L 76 50 L 68 54 L 32 54 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#sglow)"/>
    <polygon points="26,46 34,50 26,54" fill="#ef4444"/>
  </g>
</svg>
