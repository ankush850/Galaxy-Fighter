<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="mGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="mglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#mGlow)" stroke="#38bdf8" stroke-width="3" filter="url(#mglow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Horseshoe Magnet -->
  <g transform="translate(50 50) rotate(15) translate(-50 -50)">
    <!-- Red Body -->
    <path d="M 28 32 C 28 62 72 62 72 32 L 60 32 C 60 50 40 50 40 32 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <!-- Silver Tips -->
    <rect x="28" y="24" width="12" height="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="60" y="24" width="12" height="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Lightning / Magnetic Waves -->
    <path d="M 34 16 L 38 22 L 32 24 L 36 28" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" filter="url(#mglow)"/>
    <path d="M 66 16 L 62 22 L 68 24 L 64 28" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" filter="url(#mglow)"/>
    <!-- Gold Coin being attracted -->
    <circle cx="50" cy="30" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" filter="url(#mglow)"/>
    <text x="50" y="34" font-size="9" font-family="sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
  </g>
</svg>
